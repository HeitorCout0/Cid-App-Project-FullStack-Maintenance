# ============================================================
# SonarCloud - Configuração do Projeto CidApp
# Substitua os valores marcados com SEU_ pelos seus reais
# ============================================================

sonar.projectKey=SEU_PROJECT_KEY_AQUI
sonar.organization=SEU_ORG_KEY_AQUI

sonar.projectName=Cid-App-Project-FullStack-Maintenance
sonar.projectVersion=1.0

# Código-fonte do backend Java
sonar.sources=backend/Back-End/src/main/java
sonar.tests=backend/Back-End/src/test/java

# Linguagem principal
sonar.language=java
sonar.java.source=21

# Encoding
sonar.sourceEncoding=UTF-8

# Excluir arquivos gerados/desnecessários
sonar.exclusions=**/target/**,**/node_modules/**,**/*.min.js,**/dist/**

# Classes compiladas (necessário para análise mais profunda)
sonar.java.binaries=backend/Back-End/target/classes

# Relatórios de cobertura (se tiver JaCoCo configurado futuramente)
# sonar.coverage.jacoco.xmlReportPaths=backend/Back-End/target/site/jacoco/jacoco.xml
